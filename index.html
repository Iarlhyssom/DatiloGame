<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <title>DatiloGame</title>
    <link rel="stylesheet" href="./src/game/game.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-40V41WBL67"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-40V41WBL67');
    </script>

</head>
<body id="body">
    <!-- Music Player -->
    <audio id="player"></audio>
    <!-- Janela inicial fosca -->
    <div id="janela_inicial" class="windowDiv">
        <div id="gameDiv" class="ji_element">
        </div>
        <div id="ji_film" class="ji_element">
            <button id="button00" class="ji_element">Clique na Tela</button>
        </div>
        <div id="contDiv"><label id="contador">0</label></div>
    </div>
    <!-- Janela home -->
    <div id="janela_home" class="windowDiv">
        <h1 class="jh_element">Datilo Game</h1>
        <div id="container" class="jh_element">
            <div id="lefthDiv" class="jh_element">
                <div id="imageDiv" class="jh_element">
                    <img src="./src/assets/datilogifAi.gif" 
                    alt="Gif datilo feito por ai" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
            </div>
            <div id="middleDiv" class="jh_element">
                <div id="nicknameDiv">
                    <label>Nick Name</label>
                    <input value="guest">
                </div>
                <button className="button" id="newGameButton">Novo Jogo
                </button>
                <button className="button" id="persoGameButton">Personalizar
                </button>
                <button className="button" id="configButton">Configurações
                </button>
            </div>
            <div id="rightDiv" class="jh_element">
                <div id="ranking" class="jh_element">TOP RANKING
                    <div id="rankingCapsule">
                        <table class="ranking-table">
                            <thead>
                                <tr>
                                <th>Posição</th>
                                <th>Nome</th>
                                <th>Score</th>
                                <th>T/S</th>
                                <th>Time</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr id="rank0">
                                <td>1º</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                </tr>
                                <tr id="rank1">
                                <td>2º</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                </tr>
                                <tr id="rank2">
                                <td>3º</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                </tr>
                                <tr id="rank3">
                                <td>4º</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                </tr>
                                <tr id="rank4">
                                <td>5º</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                </tr>
                                <tr id="rank5">
                                <td>6º</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                </tr>
                                <tr id="rank6">
                                <td>7º</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                </tr>
                                <tr id="rank7">
                                <td>8º</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                </tr>
                                <tr id="rank8">
                                <td>9º</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                </tr>
                                <tr id="rank9">
                                <td>10º</td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div id="janela_perso" class="windowDiv">
            <div id="pr_film" class="pr_element">
                <div id="pr_capsule">
                    <div id="pr_container" class="pr_element">
                        <h1 class="pr_element">Janela de Personalização</h1>
                        <div id="colorSelect">
                            <div>
                                <label>Game Background:</label>
                                <input type="color" id="paletaBackground" value="#3b82f6">
                            </div>
                            <div>
                                <label>Border:</label>
                                <input type="color" id="paletaBorder" value="#3b82f6">
                            </div>
                            <div>
                                <label>Buttons:</label>
                                <input type="color" id="paletaButtons" value="#3b82f6">
                            </div>
                            <div>
                                <label>Text:</label>
                                <input type="color" id="paletaText" value="#3b82f6">
                            </div>
                        </div>
                        <div id="pr_buttonsDiv" class="pr_element">
                            <button Id="pr_buttonSave" className="button">Salvar</button>
                            <button Id="pr_buttonApply" className="button">Aplicar</button>
                            <button Id="pr_buttonBack" className="button">Voltar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Janela config -->
        <div id="janela_config" class="windowDiv">
            <div id="cg_film" class="cg_element">
                <div id="cg_capsule">
                    <div id="cg_container" class="cg_element">
                        <h1 class="cg_element">CONFIGURAÇÕES</h1>
                        <div id="cg_volumeDiv">
                            <label for="volume">Music:</label>
                            <input type="range" id="musicVolume" min="0" max="1" step="0.01" value="1">
                        </div>
                        <div id="cg_buttonsDiv" class="cg_element">
                            <button Id="cg_buttonSave" className="button">Salvar</button>
                            <button Id="cg_buttonBack" className="button">Voltar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Janela preferences -->
    <div id="janela_pref" class="windowDiv">
        <div id="jp_film" class="jp_element">
            <div id="jp_capsule">
                <div id="jp_container" class="jp_element">
                    <h1>PREDEFINICÕES DE JOGO</h1>
                    <div Id="div_dificult" class="jp_element">
                        <P>DIFICULDADE</P>
                        <select id="dificult_select">
                            <option>FACIL</option>
                            <option>NORMAL</option>
                            <option>DIFICIL</option>
                        </select>
                    </div>
                    <div id="div_playlist" class="jp_element">
                        <P>ESCOLHA A PLAYLIST</P>
                        <select id="playlist_select">
                            <option>PLAYLIST PADRAO</option>
                            <option>-- ADICIONAR PLAYLIST --</option>
                        </select>
                    </div>
                    <div id="jp_buttonsDiv" class="jp_element">
                        <button Id="jp_buttonPlay" className="button">Play</button>
                        <button Id="jp_buttonBack" className="button">Voltar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Janela de criação e edicão de playlists -->
    <div id="janela_makePlaylist" class="windowDiv">
        <div id="jm_film" class="jm_element">
            <div id="jm_capsule">
                <div id="jm_container" class="jm_element">
                    <h1>CRIAÇÃO DE PLAYLIST</h1>
                    <div Id="div_playlistName" class="jm_element">
                        <p>Nome da Playlist</p>
                        <input type="text">
                    </div>
                    <div id="div_musics" class="jm_element">
                        <div id="musics-list" class="jm_element">
                            <label class="musicNames">minha musica</label>
                        </div>
                        <div class="jm_element">
                            <input type="file" accept="audio/*">
                        </div>
                    </div>
                    <div id="jm_buttonsDiv" class="jm_element">
                        <button Id="jm_buttonSave" className="button">Salvar</button>
                        <button Id="jm_buttonCancel" className="button">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./src/manager/manager.js" defer></script>
</body>
</html>
