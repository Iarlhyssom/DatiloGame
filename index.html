<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <title>DatiloGame</title>
    <link rel="stylesheet" href="./src/game/game.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-40V41WBL67"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-40V41WBL67');
    </script>

</head>
<body id="body">
    <!-- Janela inicial fosca -->
    <div id="janela_inicial" class="windowDiv">
        <div id="gameDiv" class="ji_element">
        </div>
        <div id="ji_film" class="ji_element">
            <button id="button00" class="ji_element">Clique na Tela</button>
        </div>
    </div>
    <!-- Janela home -->
    <div id="janela_home" class="windowDiv">
        <h1 class="jh_element">Datilo Game</h1>
        <div id="container" class="jh_element">
            <div id="lefthDiv" class="jh_element">
                <div id="imageDiv" class="jh_element">
                </div>
            </div>
            <div id="middleDiv" class="jh_element">
                <button className="button" id="newGameButton">Novo Jogo
                </button>
                <button className="button" id="temaGameButton">Mudar Tema
                </button>
                <button className="button" id="configButton">Configurações
                </button>
            </div>
            <div id="rightDiv" class="jh_element">
                <div id="ranking" class="jh_element">TOP RANKING</div>
            </div>
        </div>
        <div id="janela_tema" class="windowDiv">
            <div id="tm_film" class="tm_element">
                <div id="tm_capsule">
                    <div id="tm_container" class="tm_element">
                        <h1 class="tm_element">MUDAR TEMA</h1>
                        <div id="tm_buttonsDiv" class="tm_element">
                            <button Id="tm_buttonSave" className="button">Salvar</button>
                            <button Id="tm_buttonBack" className="button">Voltar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Janela config -->
        <div id="janela_config" class="windowDiv">
            <div id="cg_film" class="cg_element">
                <div id="cg_capsule">
                    <div id="cg_container" class="cg_element">
                        <h1 class="cg_element">CONFIGURAÇÕES</h1>
                        <div id="cg_buttonsDiv" class="cg_element">
                            <button Id="cg_buttonSave" className="button">Salvar</button>
                            <button Id="cg_buttonBack" className="button">Voltar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Janela preferences -->
    <div id="janela_pref" class="windowDiv">
        <div id="jp_film" class="jp_element">
            <div id="jp_capsule">
                <div id="jp_container" class="jp_element">
                    <h1>PREDEFINICÕES DE JOGO</h1>
                    <div Id="div_dificult" class="jp_element">
                        <P>DIFICULDADE</P>
                        <select>
                            <option>FACIL</option>
                            <option>NORMAL</option>
                            <option>DIFICIL</option>
                        </select>
                    </div>
                    <div id="div_playlist" class="jp_element">
                        <P>ESCOLHA A PLAYLIST</P>
                        <select>
                            <option>PLAYLIST PADRAO</option>
                            <option>-ADCIONAR PLAYLIST-</option>
                        </select>
                    </div>
                    <div id="jp_buttonsDiv" class="jp_element">
                        <button Id="jp_button00" className="button">Play</button>
                        <button Id="jp_button01" className="button">Voltar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./src/manager/manager.js" defer></script>
</body>
</html>
