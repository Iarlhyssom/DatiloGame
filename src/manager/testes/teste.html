<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="./teste.js"></script>
    <style>
        /* Container principal */
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column; 
            gap: 20px;           
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Caixa da janela branca simples (Inputs) */
        .window {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 280px;
            box-sizing: border-box;
        }

        .field {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
        }

        /* DIV SEPARADA: Notebook que se ajusta PERFEITAMENTE à largura do texto */
        .notebook-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            
            width: max-content;   /* Encolhe ou estica baseado no texto */
            min-width: 150px;     /* Largura mínima para não sumir se estiver vazio */
            height: auto;
            box-sizing: border-box;
        }

        /* Elemento de texto dentro do notebook */
        #seek {
            display: block;
            width: max-content;     /* Garante que o elemento interno use a largura real do texto */
            height: auto;
            white-space: pre;       /* Impede totalmente a quebra de linha */
            font-family: monospace;
            font-weight: normal;
            color: #444;
        }
    </style>
</head>
<body>

    <!-- Bloco 1: Formulário de Inputs -->
    <div class="window">
        <div class="field">
            <label>nome</label>
            <input type="text">
        </div>
        <div class="field">
            <label>score</label>
            <input type="number">
        </div>
        
        <button>cadastrar</button>
    </div>

    <!-- Bloco 2: Notebook Separado e Auto-ajustável -->
    <div class="notebook-box">
        <label id="seek">registro do db;</label>
    </div>
    
</body>
</html>
