<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <title>DatiloGame</title>
    <link rel="stylesheet" href="./game.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-40V41WBL67"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-40V41WBL67');
    </script>
</head>
<body id="gameBody">
    
    <audio id="player"></audio>
    
    <div class="divs" id="gameDiv">
        <!-- As letras vão nascer aqui dentro -->
    </div>

    <div class="divs" id="tg_film">
        <h1 id="endScoreUi">Score: <span id="endScore">0</span></h1>
        <button id="click">Voltar Ao Inicio</button>
    </div>
    <div class="divs" id="gameUI">
        <div class="hud-item" id="lifeUi">Life: <span id="life_points">0</span></div>
        <div class="hud-item" id="scoreUi">Score: <span id="score">0</span></div>
        <div class="hud-item" id="comboUi">Combo <span id="combo">0x</span></div>
    </div>

    <!-- O ÚNICO SCRIPT: Ele vai controlar o jogo todo nos bastidores -->
    <script type="module" src="./app.js"></script>

</body>
</html>
