<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <title>DatiloGame</title>
    <link rel="stylesheet" href="./game.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-40V41WBL67"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-40V41WBL67');
    </script>
</head>
<body id="gameBody">
    
    <audio id="player"></audio>

    <div>
        <div class="divs" id="gameDiv">
            <!-- As letras vão nascer aqui dentro -->
        </div>

        <div class="divs" id="tg_film">
            <h1 id="endScoreUi">Score: <span id="endScore">0</span></h1>
            <button Id="cg_buttonReload2" className="button">Reiniciar Jogo</button>
            <button id="click">Voltar Ao Inicio</button>
        </div>
        <div class="divs" id="gameUI">
            <div class="hud-item" id="lifeUi">Life: <span id="life_points">0</span></div>
            <div class="hud-item" id="scoreUi">Score: <span id="score">0</span></div>
            <div class="hud-item" id="comboUi">Combo <span id="combo">0x</span></div>
        </div>
    </div>
    <div class="divs" id="gameStats">
        <div class="hud-item" id="difUi">dif: <span id="dificult_number">0</span></div>
        <div class="hud-item" id="tsUi">t/s: <span id="ts">0</span></div>
        <div class="hud-item" id="timeUi">time: <span id="time">0</span></div>
    </div>
    <!-- Janela config -->
        <div id="janela_config" class="windowDiv">
            <div id="cg_film" class="cg_element">
                <div id="cg_capsule">
                    <div id="cg_container" class="cg_element">
                        <h1 class="cg_element">CONFIGURAÇÕES</h1>
                         <div id="cg_volumeDiv">
                            <label for="volume">Music:</label>
                            <input type="range" id="musicVolume" min="0" max="1" step="0.01" value="1">
                        </div>
                        <div id="cg_buttonsDiv" class="cg_element">
                            <button Id="cg_buttonReload" className="button">Reiniciar Jogo</button>
                            <button Id="cg_buttonBack" className="button">Voltar ao Menu</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <!-- O ÚNICO SCRIPT: Ele vai controlar o jogo todo nos bastidores -->
    <script type="module" src="./app.js"></script>

</body>
</html>>
